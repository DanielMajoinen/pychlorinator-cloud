name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate-package-and-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip build

      - name: Validate metadata files
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          json.loads(Path('custom_components/astralpool_halo_cloud/manifest.json').read_text())
          json.loads(Path('hacs.json').read_text())
          tomllib.loads(Path('pyproject.toml').read_text())
          print('metadata_ok')
          PY

      - name: Compile integration and library
        run: python -m compileall custom_components/astralpool_halo_cloud pychlorinator_cloud

      - name: Build package wheel and sdist
        run: python -m build
