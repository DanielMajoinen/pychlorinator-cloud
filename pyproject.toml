[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pychlorinator_cloud"
version = "0.3.0-preview.1"
description = "Cloud client library for AstralPool Halo chlorinators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "websockets>=12.0",
]
keywords = ["astralpool", "chlorinator", "home-assistant", "halo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/robmarkoski/pychlorinator-cloud"
Issues = "https://github.com/robmarkoski/pychlorinator-cloud/issues"
Repository = "https://github.com/robmarkoski/pychlorinator-cloud"

[tool.setuptools.packages.find]
include = ["pychlorinator_cloud*"]

[dependency-groups]
dev = [
    "coverage>=7.14.0",
    "pytest-cov>=7.1.0",
]
