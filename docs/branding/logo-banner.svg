<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <linearGradient id="bg-banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CBAE8"/>
      <stop offset="50%" stop-color="#2A6FB8"/>
      <stop offset="100%" stop-color="#123A82"/>
    </linearGradient>
    <linearGradient id="cloud-fill-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#D0E4F2" stop-opacity="0.82"/>
    </linearGradient>
    <clipPath id="sq-b">
      <rect x="20" y="15" width="150" height="150" rx="33" ry="33"/>
    </clipPath>
    <linearGradient id="text-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#90CAF9"/>
    </linearGradient>
  </defs>

  <!-- Icon portion (left, 150x150 squircle) -->
  <g clip-path="url(#sq-b)">
    <rect x="20" y="15" width="150" height="150" fill="url(#bg-banner)"/>

    <!-- Cloud — behind droplet -->
    <g transform="translate(95, 63)">
      <ellipse cx="-16" cy="0" rx="13" ry="10" fill="url(#cloud-fill-b)"/>
      <ellipse cx="16" cy="0" rx="13" ry="10" fill="url(#cloud-fill-b)"/>
      <ellipse cx="0" cy="-6" rx="17" ry="13" fill="url(#cloud-fill-b)"/>
      <ellipse cx="-9" cy="-4" rx="12" ry="10" fill="url(#cloud-fill-b)"/>
      <ellipse cx="9" cy="-4" rx="12" ry="10" fill="url(#cloud-fill-b)"/>
      <ellipse cx="-10" cy="6" rx="12" ry="6" fill="url(#cloud-fill-b)"/>
      <ellipse cx="0" cy="7" rx="12" ry="5" fill="url(#cloud-fill-b)"/>
      <ellipse cx="10" cy="6" rx="12" ry="6" fill="url(#cloud-fill-b)"/>
    </g>

    <!-- Droplet -->
    <path d="M 95 38
             C 95 38, 92 47, 87 60
             C 81 77, 70 93, 68 103
             C 67 113, 73 126, 95 128
             C 117 126, 123 113, 122 103
             C 120 93, 109 77, 103 60
             C 98 47, 95 38, 95 38 Z"
          fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 95 38
             C 95 38, 92 47, 87 60
             C 81 77, 70 93, 68 103
             C 67 113, 73 126, 95 128
             C 117 126, 123 113, 122 103
             C 120 93, 109 77, 103 60
             C 98 47, 95 38, 95 38 Z"
          fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>

    <!-- Waves -->
    <path d="M 77 97 C 83 91, 89 103, 95 97 C 101 91, 107 103, 113 97" fill="none" stroke="#7EC8F0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 76 107 C 83 101, 89 113, 95 107 C 101 101, 107 113, 114 107" fill="none" stroke="#7EC8F0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 78 117 C 84 111, 89 123, 95 117 C 101 111, 107 123, 112 117" fill="none" stroke="#7EC8F0" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Text portion (right) -->
  <text x="195" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="30" fill="#E3F2FD">AstralPool</text>
  <text x="195" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="36" fill="#FFFFFF">Halo Cloud</text>
  <text x="195" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#90CAF9" opacity="0.8">Home Assistant Integration</text>
</svg>
